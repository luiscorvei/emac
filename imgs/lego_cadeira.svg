<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
    <defs>
        <filter id="legoShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
        </filter>
        <linearGradient id="redTop" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d32f2f" />
            <stop offset="100%" stop-color="#b71c1c" />
        </linearGradient>
        <linearGradient id="redLeft" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b71c1c" />
            <stop offset="100%" stop-color="#8e0000" />
        </linearGradient>
        <linearGradient id="redRight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8e0000" />
            <stop offset="100%" stop-color="#5f0000" />
        </linearGradient>

        <linearGradient id="blueTop" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2164b3" />
            <stop offset="100%" stop-color="#154a8a" />
        </linearGradient>
        <linearGradient id="blueLeft" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#184e94" />
            <stop offset="100%" stop-color="#0f3466" />
        </linearGradient>
        <linearGradient id="blueRight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f3466" />
            <stop offset="100%" stop-color="#082042" />
        </linearGradient>
    </defs>

    <g filter="url(#legoShadow)">
        <polygon points="110,200 150,222 150,245 110,223" fill="url(#redLeft)" />
        <polygon points="150,222 190,200 190,223 150,245" fill="url(#redRight)" />
        
        <polygon points="110,165 150,187 150,200 110,178" fill="url(#redLeft)" />
        <polygon points="150,187 190,165 190,178 150,200" fill="url(#redRight)" />

        <polygon points="100,145 150,172 150,192 100,165" fill="url(#redLeft)" />
        <polygon points="150,172 200,145 200,165 150,192" fill="url(#redRight)" />
        <polygon points="150,118 200,145 150,172 100,145" fill="url(#redTop)" />

        <g transform="translate(132, 142)">
            <path d="M0,8 C0,4 6,0 12,0 C18,0 24,4 24,8 L24,12 C24,16 18,20 12,20 C6,20 0,16 0,12 Z" fill="#b71c1c" />
            <ellipse cx="12" cy="7" rx="12" ry="6" fill="#e53935" />
        </g>
        <g transform="translate(155, 130)">
            <path d="M0,8 C0,4 6,0 12,0 C18,0 24,4 24,8 L24,12 C24,16 18,20 12,20 C6,20 0,16 0,12 Z" fill="#8e0000" />
            <ellipse cx="12" cy="7" rx="12" ry="6" fill="#d32f2f" />
        </g>

        <polygon points="100,90 145,115 145,145 100,120" fill="url(#blueLeft)" />
        <polygon points="145,115 165,104 165,134 145,145" fill="url(#blueRight)" />
        <polygon points="120,78 165,104 145,115 100,90" fill="url(#blueTop)" />

        <g transform="translate(112, 73)">
            <path d="M0,6 C0,3 5,0 10,0 C15,0 20,3 20,6 L20,9 C20,12 15,15 10,15 C5,15 0,12 0,9 Z" fill="#0f3466" />
            <ellipse cx="10" cy="5" rx="10" ry="5" fill="#2164b3" />
        </g>
        <g transform="translate(132, 84)">
            <path d="M0,6 C0,3 5,0 10,0 C15,0 20,3 20,6 L20,9 C20,12 15,15 10,15 C5,15 0,12 0,9 Z" fill="#082042" />
            <ellipse cx="10" cy="5" rx="10" ry="5" fill="#184e94" />
